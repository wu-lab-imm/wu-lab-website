lign-items:end}.upload input[type=file]{padding:8px}.news-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}.news-photo{overflow:hidden;border:2px solid #e2e6ef;border-radius:14px;background:#f8fafc}.news-photo.cover{border-color:#4f46e5;box-shadow:0 0 0 2px #c7d2fe}.news-photo img{display:block;width:100%;height:110px;object-fit:cover}.news-photo-info{padding:8px}.news-photo-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.news-photo-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}.news-photo-actions button{border:0;border-radius:6px;padding:6px 2px;cursor:pointer;background:#e8ecf5;color:#475569;font-size:11px}.news-photo-actions button.cover-button{background:#4f46e5;color:white}.news-photo-actions button.remove-button{background:#fff1f2;color:#be123c}.status{position:fixed;right:20px;bottom:20px;background:#172033;color:white;border-radius:10px;padding:12px 16px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.status.show{opacity:1;transform:none}.hint{color:#7b8497;font-size:12px;line-height:1.7}.json-editor{min-height:260px;font-family:ui-monospace,monospace;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:240px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
    .member-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:5px;align-items:stretch}.member-row>button{min-width:0}.member-order{display:grid;grid-template-rows:1fr 1fr;gap:3px}.member-order button{display:flex;width:34px;align-items:center;justify-content:center;padding:0;border:1px solid #dfe3ec;border-radius:7px;background:#f8fafc;color:#475569;font-size:12px}.member-order button:hover:not(:disabled){border-color:#818cf8;background:#eef2ff;color:#4338ca}.member-order button:disabled{cursor:not-allowed;opacity:.28}

<body>
<main class="shell">
  <header><div class="brand"><img src="/brand.svg" alt=""><div><h1>Wu Lab 内容管理</h1><p>成员 · 论文 · 新闻 · 图片</p></div></div><a class="preview" href="http://127.0.0.1:4321/wu-lab-website/" target="_blank">打开官网预览 ↗</a></header>
  <nav class="tabs"><button data-type="people" class="active">成员</button><button data-type="publications">论文</button><button data-type="news">新闻</button><button data-type="research">研究方向</button><button data-type="join">加入我们</button></nav>
  <section class="grid"><aside class="panel list" id="list"></aside><article class="panel editor"><div class="toolbar"><h2 id="title">编辑成员</h2><div class="actions"><button class="delete" id="delete">删除当前条目</button><button class="new" id="new">＋ 新建</button></div></div><form id="form"></form></article></section>
</main>
<div class="status" id="status"></div>
<script>
const peopleCommon=[['name','中文姓名','text'],['nameEn','英文姓名','text'],['role','成员身份','select'],['email','邮箱','email'],['photo','成员头像','image'],['researchInterest','研究方向（中文）','textarea'],['researchInterestEn','Research interests（英文）','textarea'],['startYear','加入年份','number'],['profileEn','English profile / 英文详细介绍','textarea']];
const peopleRoleFields={
 PI:[['position','职称（中文）','text'],['positionEn','Position / 职称（英文）','text'],['advisorCategory','导师类别（中文）','text'],['advisorCategoryEn','Supervisor category / 导师类别（英文）','text'],['department','科室 / 实验室（中文）','text'],['departmentEn','Department / Laboratory（英文）','text'],['bio','主要研究内容（中文）','textarea'],['bioEn','Research overview（英文）','textarea'],['career','教育 / 科研经历（中文，每行一项）','textarea'],['careerEn','Career & education（英文，每行一项）','textarea'],['affiliation','所在单位（中文）','text'],['affiliationEn','Affiliation / 所在单位（英文）','text'],['appointmentDate','任职日期','date'],['subjectFields','专业领域（中文，每行一个）','textarea'],['subjectFieldsEn','Research fields（英文，每行一个）','textarea'],['websiteImm','IMM 药物所官方主页','url'],['websitePumc','PUMC 北京协和医学院官方主页','url'],['website','其他个人主页','url']],
 Postdoc:[['position','当前岗位 / 职称','text'],['affiliation','所在单位','text'],['website','个人主页','url']],
 ResearchAssistant:[['position','当前岗位','text'],['affiliation','所在单位','text'],['website','个人主页','url']],
 Alumni:[['graduationYear','毕业 / 离开年份','number'],['position','毕业后去向（中文）','text'],['positionEn','Next position / 毕业去向（英文）','text'],['website','个人主页','url']],
 PhD:[],Master:[],Undergraduate:[]
};
function memberSchema(role){return [...peopleCommon,...(peopleRoleFields[role]||[]),['body','详细介绍（Markdown）','textarea']]}
const schemas={
 people:peopleCommon,
 news:[['title','标题（中文）','text'],['titleEn','Title（英文）','text'],['date','日期','date'],['summary','摘要（中文）','textarea'],['summaryEn','Summary（英文）','textarea'],['category','分类','select'],['image','封面图片','image'],['images','轮播图片路径（每行一个）','textarea'],['featured','首页推荐','checkbox'],['body','正文（中文 Markdown）','textarea'],['bodyEn','English article / 英文正文','textarea']],
 publications:[['scope','成果归属','select'],['display','在官网 Publications 展示','checkbox'],['title','英文标题（用于自动生成 ID）','textarea'],['titleCn','中文标题','textarea'],['abstractCn','中文摘要（可写简短概述）','textarea'],['abstractEn','English abstract / 英文摘要','textarea'],['image','论文配图','image'],['authors','全部作者（每行一个）','textarea'],['journal','期刊','text'],['year','年份','number'],['volume','卷','text'],['issue','期','text'],['pages','页码','text'],['doi','DOI','text'],['category','研究分类','text'],['labMembers','本组作者（每行一个，用于关联成员主页）','textarea'],['impactFactor','影响因子','number'],['isCNS','CNS 论文','checkbox'],['isHighImpact','高影响力论文','checkbox']],
 research:[['title','中文标题','text'],['titleEn','English title / 英文标题','text'],['shortName','首页简称（中文）','text'],['shortNameEn','Homepage short name（英文）','text'],['homeSlot','首页展示位置','select'],['description','研究方向简介（中文）','textarea'],['descriptionEn','English summary / 英文简介','textarea'],['detailsEn','English details / 英文详细介绍','textarea'],['image','研究配图','image'],['icon','图标 / Emoji','text'],['order','研究方向页显示顺序','number'],['body','详细介绍（中文 Markdown）','textarea']],
 join:[['headline','页面欢迎语（中文）','textarea'],['headlineEn','Headline（英文）','textarea'],['positions','开放职位（中文结构化内容）','json'],['positionsEn','Positions（英文结构化内容）','json'],['applicationSteps','申请流程（中文结构化内容）','json'],['applicationStepsEn','Application steps（英文结构化内容）','json'],['environment','实验室环境（中文结构化内容）','json'],['environmentEn','Environment（英文结构化内容）','json'],['contact','联系方式（中文结构化内容）','json'],['contactEn','Contact（英文结构化内容）','json']]
};
const roleOptions=['PI','Postdoc','PhD','Master','ResearchAssistant','Undergraduate','Alumni'];
const roleLabels={PI:'PI / 课题组长',Postdoc:'博士后',PhD:'博士研究生',Master:'硕士研究生',ResearchAssistant:'研究助理',Undergraduate:'本科生',Alumni:'已毕业 / 已离开'};
const roleSequence=['PI','ResearchAssistant','Postdoc','PhD','Master','Undergraduate','Alumni'];
const categoryOptions=['publication','award','conference','general'];
let type='people',items=[],current=null,dirty=false,saveTimer=null,savePromise=Promise.resolve();
const $=s=>document.querySelector(s), status=t=>{const e=$('#status');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
async function api(url,options){const r=await fetch(url,options);const v=await r.json();if(!r.ok)throw Error(v.error||'操作失败');return v}
async function load(){const data=await api('/api/content?type='+type);items=type==='join'?[data]:data;current=items[0]||null;dirty=false;renderList();renderForm()}
function label(item){if(type==='join')return 'Join 页面全部内容';if(type==='people')return [item.data.name,item.data.nameEn].filter(Boolean).join(' · ');if(type==='news'||type==='research')return item.data.title;return `${item.year||'草稿'} · ${item.title}`}
function renderList(){
 const list=$('#list');list.innerHTML=`<input id="list-search" type="search" placeholder="搜索当前列表…" style="margin:2px 2px 10px;width:calc(100% - 4px)" ${type==='join'?'hidden':''}><div id="list-items"></div>`;
 const draw=(query='')=>{const box=$('#list-items');box.innerHTML='';const shown=type==='people'?[...items].sort((a,b)=>roleSequence.indexOf(a.data.role)-roleSequence.indexOf(b.data.role)||(a.data.order??9999)-(b.data.order??9999)||label(a).localeCompare(label(b),'zh-CN')):items;let lastRole='';shown.forEach(item=>{if(!label(item).toLowerCase().includes(query.toLowerCase()))return;if(type==='people'&&item.data.role!==lastRole){lastRole=item.data.role;const heading=document.createElement('div');heading.style.cssText='padding:14px 12px 5px;color:#64748b;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase';heading.textContent=roleLabels[lastRole]||lastRole;box.append(heading)}const b=document.createElement('button');b.className=item===current?'active':'';const detail=type==='publications'?`${item.scope==='lab'?'课题组成果':'吴老师代表作'} · ${item.journal||'待补期刊'} · ${item.display===false?'不展示':'展示'}`:type==='people'?`组内顺序 · ${item.data.startYear||'未填加入年份'}`:item.id||'页面配置';b.innerHTML=`${label(item)}<small>${detail}</small>`;b.onclick=async()=>{await saveCurrent();current=item;renderList();renderForm()};if(type==='people'){const group=shown.filter(person=>person.data.role===item.data.role),index=group.indexOf(item),row=document.createElement('div'),controls=document.createElement('div'),up=document.createElement('button'),down=document.createElement('button');row.className='member-row';controls.className='member-order';up.type=down.type='button';up.textContent='↑';down.textContent='↓';up.title='在当前身份组内上移';down.title='在当前身份组内下移';up.disabled=index===0;down.disabled=index===group.length-1;up.onclick=()=>reorderPerson(item,'up');down.onclick=()=>reorderPerson(item,'down');controls.append(up,down);row.append(b,controls);box.append(row)}else box.append(b)})};draw();$('#list-search').oninput=e=>draw(e.target.value)
}
async function reorderPerson(item,direction){await saveCurrent();const selectedId=current?.id;await api('/api/reorder',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'people',id:item.id,direction})});items=await api('/api/content?type=people');current=items.find(person=>person.id===selectedId)||items.find(person=>person.id===item.id)||items[0];dirty=false;renderList();status(direction==='up'?'已在组内上移':'已在组内下移')}
function renderForm(){
 const form=$('#form');const titles={people:'编辑成员',news:'编辑新闻',publications:'编辑论文',research:'编辑研究方向',join:'管理 Join 页面'};$('#title').textContent=titles[type];$('#new').hidden=type==='join';$('#delete').hidden=type==='join'||!current;
 if(type==='join'){const value=current||{};form.innerHTML=`<p class="hint">修改停止约 1 秒后自动保存。列表中每个大括号是一项，可直接增删。</p><div class="fields">${schemas.join.map(([key,text,kind])=>field(key,text,kind,value[key])).join('')}<p class="wide"><button class="save">立即保存</button></p></div>`;bindForm(saveJoin);return}
 if(type==='publications'){const value=current||{scope:'lab',display:true};form.innerHTML=`<p class="hint">中文页面会依次展示中文摘要和英文摘要；英文页面只展示英文摘要。切换条目前会自动保存，ID 自动生成。</p><div class="fields">${schemas.publications.map(([key,text,kind])=>{const fieldValue=publicationFieldValue(value,key);return field(key,text,kind,Array.isArray(fieldValue)?fieldValue.join('\n'):fieldValue)}).join('')}<div class="wide upload"><label style="flex:1">上传论文配图<input type="file" id="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" class="new" id="upload">上传并替换配图</button></div><p class="wide"><button class="save">立即保存</button></p></div>`;bindForm(savePublication);$('#upload').onclick=upload;return}
 const value=current||{id:'',data:{role:'Master'},body:''};const activeSchema=type==='people'?memberSchema(value.data.role||'Master'):schemas[type];const renderedSchema=type==='news'?activeSchema.filter(([key])=>!['image','images'].includes(key)):activeSchema;form.dataset.fields=activeSchema.map(([key])=>key).join(',');const hint=type==='people'?`当前为“${roleLabels[value.data.role||'Master']}”字段；成员会按身份自动分组、在组内自动排序，无需填写顺序。更改身份后会自动移动到新分组末尾。`:type==='research'?'可选择首页主卡或副卡，并设置中英文简称；同一位置只能选择一个研究方向。':'逐张上传轮播图；可设置封面、调整顺序或移除。勾选首页推荐后，该新闻会显示在首页。';const gallery=type==='news'?newsGalleryMarkup(value.data):'';const uploadText=type==='news'?'继续添加轮播图片':`上传并替换${type==='people'?'头像':'图片'}`;
 form.innerHTML=`<p class="hint">${hint} 修改停止约 1 秒后自动保存。</p><div class="fields">${renderedSchema.map(([key,text,kind])=>field(key,text,kind,key==='body'?value.body:Array.isArray(value.data[key])?value.data[key].join('\n'):value.data[key])).join('')}${gallery}<div class="wide upload"><label style="flex:1">${uploadText}<input type="file" id="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" class="new" id="upload">${type==='news'?'添加图片':'上传图片'}</button></div><p class="wide"><button class="save">立即保存</button></p></div>`;bindForm(saveMarkdown);$('#upload').onclick=upload;if(type==='news')drawNewsGallery();if(type==='people')form.elements.role.onchange=async()=>{dirty=true;await saveCurrent();renderForm()}
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function publicationFieldValue(value,key){if(value[key]!==undefined)return value[key];if(!value.abstract)return '';const isChinese=/[\u3400-\u9fff]/.test(value.abstract);if(key==='abstractCn'&&isChinese)return value.abstract;if(key==='abstractEn'&&!isChinese)return value.abstract;return ''}
function newsGalleryMarkup(data){const paths=[...(data.images||[]),data.image].filter((path,index,list)=>path&&list.indexOf(path)===index);return `<section class="wide"><label>轮播图片与封面</label><input type="hidden" name="image" value="${escapeHtml(data.image||'')}"><textarea name="images" hidden>${escapeHtml(paths.join('\n'))}</textarea><div id="news-gallery" class="news-gallery"></div><p class="hint">“封面”用于首页推荐；轮播按照这里的图片顺序播放。移除只取消新闻关联，不删除服务器原图。</p></section>`}
function newsGalleryValues(){const form=$('#form'),paths=(form.elements.images?.value||'').split('\n').map(path=>path.trim()).filter(Boolean);return {paths,cover:form.elements.image?.value||''}}
function setNewsGallery(paths,cover){const form=$('#form');form.elements.images.value=paths.join('\n');form.elements.image.value=cover;dirty=true;drawNewsGallery()}
function drawNewsGallery(){const box=$('#news-gallery');if(!box)return;const {paths,cover}=newsGalleryValues();box.innerHTML='';if(!paths.length){box.innerHTML='<p class="hint">尚未上传图片</p>';return}paths.forEach((path,index)=>{const card=document.createElement('div');card.className=`news-photo${path===cover?' cover':''}`;card.innerHTML=`<img src="${escapeHtml(previewUrl(path))}" alt="轮播图片 ${index+1}"><div class="news-photo-info"><strong>${path===cover?'首页封面 · ':''}第 ${index+1} 张</strong><div class="news-photo-actions"><button type="button" title="前移">←</button><button type="button" title="后移">→</button><button type="button" class="cover-button">封面</button><button type="button" class="remove-button">移除</button></div></div>`;const buttons=card.querySelectorAll('button');buttons[0].disabled=index===0;buttons[1].disabled=index===paths.length-1;buttons[0].onclick=async()=>{[paths[index-1],paths[index]]=[paths[index],paths[index-1]];setNewsGallery(paths,cover);await saveCurrent()};buttons[1].onclick=async()=>{[paths[index+1],paths[index]]=[paths[index],paths[index+1]];setNewsGallery(paths,cover);await saveCurrent()};buttons[2].onclick=async()=>{setNewsGallery(paths,path);await saveCurrent()};buttons[3].onclick=async()=>{const next=paths.filter((_,i)=>i!==index);setNewsGallery(next,path===cover?(next[0]||''):cover);await saveCurrent()};box.append(card)})}
function previewUrl(value){return value?.startsWith('/wu-lab-website/')?`http://127.0.0.1:4321${value}`:value||''}
function field(key,text,kind,value=''){if(kind==='select'){const values=key==='role'?roleOptions:key==='scope'?['lab','pi']:key==='homeSlot'?['','primary','secondary']:categoryOptions;const labels={lab:'课题组成立后成果',pi:'吴老师代表作','':'不在首页展示',primary:'首页主卡（右上大图）',secondary:'首页副卡（左下叠图）',...roleLabels};return `<label>${text}<select name="${key}">${values.map(v=>`<option value="${v}" ${v===value?'selected':''}>${labels[v]||v}</option>`).join('')}</select></label>`}if(kind==='textarea')return `<label class="wide">${text}<textarea name="${key}">${value||''}</textarea></label>`;if(kind==='json')return `<label class="wide">${text}<textarea class="json-editor" name="${key}">${JSON.stringify(value,null,2)}</textarea></label>`;if(kind==='checkbox')return `<label>${text}<input name="${key}" type="checkbox" ${value?'checked':''}></label>`;if(kind==='image')return `<label class="wide">${text}<img src="${previewUrl(value)}" alt="当前图片" style="${value?'':'display:none;'}width:140px;height:140px;object-fit:cover;border-radius:16px;margin:10px 0;border:1px solid #e2e6ef"><input name="${key}" type="text" value="${value??''}"></label>`;const step=key==='impactFactor'?' step="0.1"':'';const inputValue=kind==='date'&&value?String(value).slice(0,10):(value??'');return `<label>${text}<input name="${key}" type="${kind}"${step} value="${inputValue}"></label>`}
function values(form){const out={};new FormData(form).forEach((v,k)=>out[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(e=>out[e.name]=e.checked);['order','startYear','graduationYear','year','impactFactor'].forEach(k=>{if(out[k]!==undefined&&out[k]!=='')out[k]=Number(out[k]);else delete out[k]});Object.keys(out).forEach(k=>{if(out[k]==='')delete out[k]});return out}
function bindForm(handler){const form=$('#form');form.onsubmit=e=>{e.preventDefault();savePromise=handler(form)};form.oninput=()=>{dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,1000)}}
async function saveCurrent(){if(!dirty)return;clearTimeout(saveTimer);$('#form').requestSubmit();await savePromise}
async function saveMarkdown(form){const old=current,v=values(form),id=old?.id,body=v.body||'';delete v.body;if(v.images)v.images=v.images.split('\n').map(x=>x.trim()).filter(Boolean);for(const key of ['career','careerEn','subjectFields','subjectFieldsEn'])if(v[key])v[key]=v[key].split('\n').map(x=>x.trim()).filter(Boolean);const data={...(old?.data||{}),...v};const activeKeys=(form.dataset.fields||'').split(',');for(const key of activeKeys)if(key!=='body'&&!(key in v))delete data[key];const result=await api('/api/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,id,data,body})});if(result.clearedIds?.length)items.forEach(item=>{if(result.clearedIds.includes(item.id))delete item.data.homeSlot});const saved={id:result.id,data:result.data||data,body};if(old)items[items.indexOf(old)]=saved;else items.unshift(saved);current=saved;dirty=false;renderList();status('已自动保存')}
async function savePublication(form){const old=current,v=values(form);if(old?.id)v.id=old.id;['authors','labMembers'].forEach(k=>v[k]=(v[k]||'').split('\n').map(x=>x.trim()).filter(Boolean));const next=old?items.map(item=>item===old?v:item):[v,...items];const result=await api('/api/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,items:next})});items=result.items;current=items.find(item=>item.id===(old?.id||v.id))||items[0];dirty=false;renderList();status('已自动保存')}
async function saveJoin(form){const raw=values(form),data={headline:raw.headline,headlineEn:raw.headlineEn};for(const key of ['positions','positionsEn','applicationSteps','applicationStepsEn','environment','environmentEn','contact','contactEn'])data[key]=JSON.parse(raw[key]);const result=await api('/api/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'join',data})});items=[result.data];current=result.data;dirty=false;status('Join 中英文页面已自动保存')}
function fileDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('读取图片失败'));reader.readAsDataURL(file)})}
async function prepareUpload(file,kind){
 if(!['members','news'].includes(kind))return {filename:file.name,data:await fileDataUrl(file),optimized:false};
 const bitmap=await createImageBitmap(file),maxEdge=kind==='members'?1400:2400,scale=Math.min(1,maxEdge/Math.max(bitmap.width,bitmap.height)),width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale)),canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const context=canvas.getContext('2d');context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';context.drawImage(bitmap,0,0,width,height);bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',kind==='members'?.86:.9));
 if(!blob||blob.size>=file.size)return {filename:file.name,data:await fileDataUrl(file),optimized:false};
 const stem=file.name.replace(/\.[^.]+$/,'')||kind;return {filename:`${stem}.webp`,data:await fileDataUrl(blob),optimized:true};
}
async function upload(){const file=$('#file').files[0];if(!file)return status('请先选择图片');try{const kind=type==='people'?'members':type==='publications'?'publications':type==='research'?'research':'news';status(['members','news'].includes(kind)?'正在优化并上传图片…':'正在上传图片…');const prepared=await prepareUpload(file,kind);const result=await api('/api/upload',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,filename:prepared.filename,data:prepared.data})});if(type==='news'){const {paths,cover}=newsGalleryValues();paths.push(result.path);setNewsGallery(paths,cover||result.path)}else{const target=document.querySelector('[name=image],[name=photo]');if(!target)throw Error('当前栏目没有找到图片字段');target.value=result.path;target.dispatchEvent(new Event('input',{bubbles:true}));const preview=target.parentElement.querySelector('img');if(preview){preview.src=`http://127.0.0.1:4321${result.path}?v=${Date.now()}`;preview.style.display='block'}}await saveCurrent();$('#file').value='';const message=type==='news'?'图片已添加到轮播并保存':'图片已上传并保存';status(prepared.optimized?`${message}（已自动压缩）`:message)}catch(error){status(error.message||'图片上传失败')}}
$('#new').onclick=async()=>{await saveCurrent();current=null;renderList();renderForm()};$('#delete').onclick=async()=>{if(!current||!confirm(`确认删除“${label(current)}”？删除内容会进入归档，可恢复。`))return;await api('/api/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type,id:current.id})});items=items.filter(item=>item!==current);current=items[0]||null;dirty=false;renderList();renderForm();status('已删除并归档')};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=async()=>{await saveCurrent();document.querySelector('.tabs .active').classList.remove('active');b.classList.add('active');type=b.dataset.type;await load()});load().catch(e=>status(e.message));
window.addEventListener('unhandledrejection',event=>{event.preventDefault();status(event.reason?.message||'保存失败，请检查必填字段')});
</script>
